; Add the `WeirdEd` top-level menu to the end of your `menu_edit...` sections
; in menu.cfg, something like this:
;
; Before:  menu_edit_3 &Textures:menu_textures | E&AX:menu_eax
;
; After:   menu_edit_3 &Textures:menu_textures | E&AX:menu_eax | &WeirdEd:menu_weirded
;
; Then, copy and paste all the following lines to the end of your menu.cfg:

;WeirdEd
menu_weirded   Select Cursor (&0):find_obj EdCursor|Select Marker &1:find_obj EdMarker1|sep
menu_weirded_1 &Cable:menu_cable

menu_cable   &Start cable:run_cmd_script editor/cmds/cable_start.cmd
menu_cable_1 &Make cable segment (G):run_cmd_script editor/cmds/go.cmd
menu_cable_2 &Redo last (Shift+G):run_cmd_script editor/cmds/goagain.cmd
menu_cable_3 &Finish cable (Ctrl+G):run_cmd_script editor/cmds/stop.cmd
menu_cable_4 sep|Set width &1 (0.0625):set ed_cable_width 1
menu_cable_5 Set width &2 (0.125):set ed_cable_width 2
menu_cable_6 Set width &3 (0.25):set ed_cable_width 3
menu_cable_7 Set width &4 (0.5):set ed_cable_width 4
menu_cable_8 Set width &5 (1.0):set ed_cable_width 5
